name: Pull Request Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Show branch information
        run: |
          echo "Testing Pull Request"
          echo "Repository: ${{ github.repository }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Run application test
        run: |
          test -f index.html
          echo "Application test passed!"

  deploy-test:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/github-actions
          chmod 600 ~/.ssh/github-actions
          ssh-keyscan -H "${{ secrets.TEST_SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to testing server
        run: |
          scp -i ~/.ssh/github-actions \
            index.html \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:/tmp/index.html

      - name: Install website
        run: |
          ssh -i ~/.ssh/github-actions \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "sudo cp /tmp/index.html /var/www/shopping/index.html"

      - name: Verify deployment
        run: |
          curl http://${{ secrets.TEST_SERVER_HOST }}:4000/
